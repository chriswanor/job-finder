name: Daily job digest
on:
  workflow_dispatch:
    inputs:
      send_email:
        description: Send real email (otherwise dry run)
        type: boolean
        default: false
  schedule:
    # 8 AM Chicago in winter, 9 AM during daylight saving time.
    - cron: '0 14 * * *'
permissions:
  contents: read
concurrency:
  group: daily-job-digest
  cancel-in-progress: false
jobs:
  search:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_DAILY_EMAIL == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - uses: actions/cache/restore@v4
        with:
          path: .data
          key: job-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: job-history-
      - name: Search and optionally email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          SEND_EMAIL: ${{ github.event_name == 'schedule' || inputs.send_email }}
        run: |
          if [ "$SEND_EMAIL" = "true" ]; then
            python -m job_finder --send
          else
            python -m job_finder
          fi
      - uses: actions/cache/save@v4
        if: success()
        with:
          path: .data
          key: job-history-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: job-search-report
          path: output/
          retention-days: 14
